<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Headlines App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="container">
    <h1>📰 News Headlines App</h1>

    <form method="POST" class="search-form">
      <input
        type="text"
        name="topic"
        placeholder="Enter News Topic"
        value="{{ topic }}"
        required
      >
      <button type="submit">Search</button>
    </form>

    {% if topic %}
      <h2>📰 Top News for {{ topic }}</h2>
    {% endif %}

    {% if articles %}
      <ul class="news-list">
        {% for news in articles %}
          <li>• {{ news["title"] }}</li>
        {% endfor %}
      </ul>
    {% elif message %}
      <p class="message">{{ message }}</p>
    {% endif %}
  </div>

</body>
</html>
